<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Dynamic Wave / Road Motif representing "Bidean" (on the road / path) -->
  <path d="M 64 360 C 180 360, 180 200, 320 200 C 390 200, 420 250, 448 240" 
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="28" stroke-linecap="round" />

  <!-- Speech Bubble Graphic representing Basque speech & activation -->
  <g filter="url(#shadow)" transform="translate(100, 100)">
    <!-- Main Bubble -->
    <path d="M 60 40 C 26.8 40, 0 66.8, 0 100 C 0 133.2, 26.8 160, 60 160 L 80 160 L 60 210 L 120 160 L 250 160 C 283.2 160, 310 133.2, 310 100 C 310 66.8, 283.2 40, 250 40 Z" 
          fill="#ffffff" />
    
    <!-- Pulse Soundwave Lines inside Bubble (Activation & Voice) -->
    <rect x="75" y="80" width="14" height="40" rx="7" fill="#059669" />
    <rect x="105" y="65" width="14" height="70" rx="7" fill="#0d9488" />
    <rect x="135" y="55" width="14" height="90" rx="7" fill="#0284c7" />
    <rect x="165" y="70" width="14" height="60" rx="7" fill="#0d9488" />
    <rect x="195" y="82" width="14" height="36" rx="7" fill="#059669" />
    <circle cx="235" cy="100" r="10" fill="#f59e0b" />
  </g>

  <!-- Sparkle / Impact Symbol (Eragin) at top right -->
  <path d="M 400 90 L 412 118 L 440 130 L 412 142 L 400 170 L 388 142 L 360 130 L 388 118 Z" 
        fill="#fde047" opacity="0.95" />

  <!-- Bottom Text Label: "BIDEAN ERAGIN" -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#ffffff"
        opacity="0.95">
    BIDEAN ERAGIN
  </text>
</svg>
