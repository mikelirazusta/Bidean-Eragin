<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="seaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144B5E" />
      <stop offset="55%" stop-color="#103C4C" />
      <stop offset="100%" stop-color="#0B2A36" />
    </linearGradient>
    <linearGradient id="t2Bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Square -->
  <rect width="512" height="512" rx="112" fill="url(#seaBg)" />

  <!-- Subtle Editorial Hairline Frame -->
  <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="#F7F5F0" stroke-opacity="0.12" stroke-width="2.5" />

  <!-- Subtle Horizontal Baseline -->
  <line x1="108" y1="388" x2="404" y2="388" stroke="#F7F5F0" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round" />

  <!-- T0 -> T1 -> T2 Ascending Bars -->
  <rect x="122" y="276" width="64" height="104" rx="14" fill="#F7F5F0" fill-opacity="0.38" />
  <rect x="224" y="216" width="64" height="164" rx="14" fill="#F7F5F0" fill-opacity="0.72" />
  <rect x="326" y="142" width="64" height="238" rx="14" fill="url(#t2Bar)" />

  <!-- Trajectory Arc ("Bidean") & Impact Node ("Eragin") -->
  <path
    d="M 146 232 C 204 204, 266 154, 358 106"
    fill="none"
    stroke="#F7F5F0"
    stroke-width="11"
    stroke-linecap="round"
  />
  <circle cx="358" cy="106" r="16" fill="#F7F5F0" />
  <circle cx="358" cy="106" r="7" fill="#10B981" />
</svg>
